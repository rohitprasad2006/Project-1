<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact · Hello, World!</title>
    <style>
      :root { color-scheme:dark; --ink:#f7f4ff; --muted:#c3c0d9; --aqua:#67e8f9; }
      * { box-sizing:border-box; } body { align-items:center; background:radial-gradient(circle at 15% 75%,rgba(103,232,249,.22),transparent 27rem),radial-gradient(circle at 84% 15%,rgba(158,123,255,.25),transparent 29rem),#0b0920; display:grid; font-family:Inter,ui-sans-serif,system-ui,sans-serif; margin:0; min-height:100vh; place-items:center; }
      .card { background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.2); border-radius:28px; box-shadow:0 24px 80px rgba(0,0,0,.45); max-width:680px; padding:clamp(2.5rem,7vw,5rem); text-align:center; width:min(90vw,680px); }
      nav { display:flex; gap:.65rem; justify-content:center; margin:0 0 2.3rem; } nav a { border:1px solid rgba(255,255,255,.2); border-radius:999px; color:var(--ink); font-size:.85rem; font-weight:700; padding:.55rem .9rem; text-decoration:none; transition:.2s; } nav a:hover,nav a[aria-current="page"] { background:rgba(255,255,255,.16); transform:translateY(-2px); }
      .eyebrow { color:var(--aqua); font-size:.75rem; font-weight:800; letter-spacing:.2em; margin:0 0 1.2rem; text-transform:uppercase; } h1 { color:var(--ink); font-size:clamp(2.8rem,8vw,4.9rem); letter-spacing:-.06em; line-height:.95; margin:0; } p { color:var(--muted); font-size:1.1rem; line-height:1.7; margin:1.6rem auto; max-width:31rem; }
      .button { background:linear-gradient(120deg,var(--aqua),#a68cff); border-radius:999px; color:#120d2a; display:inline-block; font-weight:800; padding:.85rem 1.25rem; text-decoration:none; transition:transform .2s ease,box-shadow .2s ease; } .button:hover { box-shadow:0 10px 28px rgba(103,232,249,.25); transform:translateY(-3px); }
    </style>
  </head>
  <body>
    <main class="card">
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html" aria-current="page">Contact</a>
      </nav>
      <p class="eyebrow">Let’s connect</p>
      <h1>Say hello.</h1>
      <p>Have an idea, a question, or simply want to share a good thought? I would love to hear from you.</p>
      <a class="button" href="mailto:hello@example.com">Send an email →</a>
    </main>
  </body>
</html>
