<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f4ff;
        --muted: #c3c0d9;
        --violet: #9e7bff;
        --aqua: #67e8f9;
      }

      * { box-sizing: border-box; }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 18% 20%, rgba(103, 232, 249, .22), transparent 27rem),
          radial-gradient(circle at 84% 75%, rgba(158, 123, 255, .25), transparent 29rem),
          #0b0920;
        display: grid;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        place-items: center;
      }

      .glow {
        animation: drift 12s ease-in-out infinite alternate;
        background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.02));
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2);
        max-width: 680px;
        padding: clamp(2.5rem, 7vw, 5rem);
        position: relative;
        text-align: center;
        width: min(90vw, 680px);
      }

      .glow::before {
        background: linear-gradient(90deg, var(--aqua), var(--violet), var(--aqua));
        border-radius: inherit;
        content: "";
        inset: -1px;
        opacity: .8;
        position: absolute;
        z-index: -1;
      }

      .eyebrow {
        color: var(--aqua);
        font-size: .75rem;
        font-weight: 800;
        letter-spacing: .2em;
        margin: 0 0 1.4rem;
        text-transform: uppercase;
      }

      h1 {
        background: linear-gradient(120deg, #fff, #d9d0ff 52%, #8ff2ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: clamp(3.4rem, 10vw, 6.3rem);
        letter-spacing: -.065em;
        line-height: .9;
        margin: 0;
      }

      p {
        color: var(--muted);
        font-size: clamp(1rem, 2.2vw, 1.22rem);
        line-height: 1.65;
        margin: 1.7rem auto 0;
        max-width: 33rem;
      }

      .spark { color: var(--aqua); }

      nav { display: flex; gap: .65rem; justify-content: center; margin: 0 0 2.3rem; }
      nav a {
        border: 1px solid rgba(255,255,255,.2); border-radius: 999px; color: var(--ink);
        font-size: .85rem; font-weight: 700; padding: .55rem .9rem; text-decoration: none;
        transition: background .2s ease, transform .2s ease;
      }
      nav a:hover, nav a[aria-current="page"] { background: rgba(255,255,255,.16); transform: translateY(-2px); }

      @keyframes drift {
        from { transform: translateY(-7px) rotate(-.35deg); }
        to { transform: translateY(7px) rotate(.35deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .glow { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="glow">
      <nav aria-label="Main navigation">
        <a href="hello-world.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <p class="eyebrow">A friendly beginning</p>
      <h1>Hello,<br />World<span class="spark">!</span></h1>
      <p>A tiny message with a little stardust—ready for whatever you build next.</p>
    </main>
  </body>
</html>
